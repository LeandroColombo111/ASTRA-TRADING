[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-trading"
version = "0.1.0"
description = "Auditable futures trend research and paper trading service"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
reports = ["matplotlib>=3.10,<4"]

[project.scripts]
astra = "astra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
